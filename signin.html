<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./main.css">
    <title>Sign In</title>
</head>

<body>
    <main>
        <div class="container" id="form-square">
            <h1 subheading>Welcome Back</h1>
            <p class="subheading">Please enter your details to sign in</p>
            <form action="">
                <div class="input-category">
                    <label for="email">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="Enter your email">
                </div>
                <div class="input-category">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" placeholder="........">
                </div>
                <div class="input-box">
                <p>Forgot password?</p>
            </div>
                <button type="submit" class="signin-btn">Sign in</button>
            </form>
           
        <p class="switch-line">Don't have an account?
            <a href="./signup.html" class="switch-note">Sign up</a>
        </p>
        
         </div>
    </main>
</body>

</html>
