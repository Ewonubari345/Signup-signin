<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>SIGN UP</title>
</head>
<body>
    <main>
     <div class="form-container" id="form-box">
        <h1>Create Account</h1>
        <p class="subtitle">Join us today by filling out your info</p>
        <form action="">
            <div class="input-group">
                <label for="fullname">Fullname</label>
                <input type="text" name="Fullname" id="fullname">
            </div>
            <div class="input-group">
                <label for="email">Email Addresss</label>
                <input type="email" name="email" id="email">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" name="Sign-up-password" id="password">
            </div>
            <button type="submit" class="signup-btn">Signup</button>
        </form>
        <p class="switch-text">Already have an account?
        <a href="./signin.html" class="switch-link">Sign in</a>
        </p>
     </div>   
    </main>
</body>
</html>
